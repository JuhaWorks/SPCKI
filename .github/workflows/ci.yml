name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Test · Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spcki_owner
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: spcki_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://spcki_owner:testpassword@localhost:5432/spcki_test
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci_test_secret_long_enough_for_testing_purposes_only
      JWT_REFRESH_SECRET: ci_test_refresh_secret_long_enough_for_testing_purposes
      ACCESS_TOKEN_MINUTES: '15'
      REFRESH_TOKEN_DAYS: '7'
      CORS_ORIGIN: http://localhost:5173
      COOKIE_DOMAIN: localhost
      LOG_LEVEL: silent
      BACKUP_DIR: /tmp/backups
      BACKUP_ENCRYPTION_KEY: ci_test_backup_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: pern
        run: npm ci

      - name: Lint – Server
        working-directory: pern
        run: npm run lint --workspace=server

      - name: Lint – Client
        working-directory: pern
        run: npm run lint --workspace=client

      - name: Test – Server
        working-directory: pern
        run: npm run test --workspace=server

      - name: Test – Client
        working-directory: pern
        run: npm run test --workspace=client

      - name: Security audit
        working-directory: pern
        run: npm audit --audit-level=high
